name: Task 9 api build test

on:
  push:
    branches:
      - main

    paths:
      - "9.k8s_payment_app/payment-api/**"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: finpay-runner

    defaults:
      run:
        working-directory: ./9.k8s_payment_app/payment-api
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Tag
        run: echo "SHA_TAG=${GITHUB_SHA::6}" >> $GITHUB_ENV
        
      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y unzip curl
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
          fi
          aws --version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::366183011726:role/GitHubApplyRole
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 366183011726.dkr.ecr.eu-central-1.amazonaws.com
    
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg HTTP_PROXY=http://10.20.1.162/3128 \
            --build-arg HTTPS_PROXY=http://10.20.1.162/3128 \
            --build-arg NO_PROXY=localhost,127.0.0.1,.svc,.cluster.local,10.20.0.0/16,172.20.0.0/16 \
            -f Dockerfile.api \
            -t 366183011726.dkr.ecr.eu-central-1.amazonaws.com/payment-api:latest \
            -t 366183011726.dkr.ecr.eu-central-1.amazonaws.com/payment-api:${SHA_TAG} \
            .

      - name: Debug proxy
        run: |
          echo "Checking proxy configuration"
          env | grep -i proxy | sed -E 's#(https?://)[^/@]+:[^/@]+@#\1***@#g'
          curl -sSIL --connect-timeout 10 \
            -x http://10.20.1.162:3128 \
            https://github.com/aquasecurity/trivy/releases/tag/v0.70.0

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          HTTP_PROXY: http://10.20.1.162:3128
          HTTPS_PROXY: http://10.20.1.162:3128
          NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local,10.20.0.0/16,172.20.0.0/16
        with:
          image-ref: '366183011726.dkr.ecr.eu-central-1.amazonaws.com/payment-api:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push docker image
        run: |
          docker push 366183011726.dkr.ecr.eu-central-1.amazonaws.com/payment-api:latest
          docker push 366183011726.dkr.ecr.eu-central-1.amazonaws.com/payment-api:${SHA_TAG}
       
