name: Self-hosted k8s Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: finpay-runner
    steps:
      - name: Show runner details
        run: |
          echo "Self-hosted runner works!"
          echo "Runner name: $RUNNER_NAME"
          echo "Operating system: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"

      - name: Test tools
        run: |
          kubectl version --client || true
          docker --version || true
