name: Task 3 deploy

on:
  push:
    branches:
      - main

    paths:
      - "3.aws-ecs-app-task-part1/Part2and3/**"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    permissions:
      id-token: write
      contents: read

    uses: ./.github/workflows/terraform-reusable.yml

    with:
      working_directory: 3.aws-ecs-app-task-part1/Part2and3
      run_docker_build: true
      docker_image_name: hello-world-repo
      docker_context: ./app
