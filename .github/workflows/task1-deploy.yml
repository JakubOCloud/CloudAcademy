name: Task 1 deploy

on:
  push:
    branches:
      - main

    paths:
      - "1.AWS_static_website/Part2/terraform_static_site/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    permissions:
      id-token: write
      contents: read

    uses: ./.github/workflows/terraform-reusable.yml

    with:
      working_directory: ./1.AWS_static_website/Part2/terraform_static_site

      run_docker_build: false
