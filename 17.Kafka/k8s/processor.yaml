apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  namespace: kafka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      containers:
        - name: processor
          image: processor:1.0
          imagePullPolicy: Never
          env:
            - name: KAFKA_BROKERS
              value: "kafka-cluster-kafka-bootstrap:9092"
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name