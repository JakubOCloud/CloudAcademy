apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publisher
  template:
    metadata:
      labels:
        app: publisher
    spec:
      containers:
        - name: publisher
          image: publisher:1.0
          imagePullPolicy: Never
          env:
            - name: KAFKA_BROKERS
              value: "kafka-cluster-kafka-bootstrap:9092"