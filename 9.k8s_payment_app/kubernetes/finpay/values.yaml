namespace: payment-system

global:
  imagePullPolicy: IfNotPresent

api:
  replicaCount: 3

  image:
    repository: payment-api
    tag: 1.0.0

  service:
    port: 8080

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuUtilization: 70

worker:
  replicaCount: 3

  image:
    repository: payment-worker
    tag: 1.0.0

  service:
    port: 8080

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuUtilization: 70

config:
  APP_ENV: local
  LOG_LEVEL: DEBUG

ingress:
  enabled: true
  className: nginx
  host: payment.local

serviceAccount:
  create: true
  name: payment-system-sa
    




