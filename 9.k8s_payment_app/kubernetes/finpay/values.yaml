namespace: payment-system

global:
  imagePullPolicy: IfNotPresent

api:
  replicaCount: 3

  image:
    repository: payment-api
    tag: 1.0.0

  service:
    port: 8080

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    minReplicas: 3
    maxReplicas: 10
    cpuUtilization: 70

worker:
  replicaCount: 3

  image:
    repository: payment-worker
    tag: 1.0.0

  service:
    port: 8080

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    minReplicas: 3
    maxReplicas: 10
    cpuUtilization: 70

config:
  APP_ENV: local
  LOG_LEVEL: DEBUG

secret:
  PAYMENT_DB_URL: jdbc:postgresql://postgres-service:5432/payments
  PAYMENT_DB_USER: payments
  PAYMENT_DB_PASSWORD: payments
  PAYMENT_WORKER_BASE_URL: http://localhost:8090
  PAYMENT_WORKER_PORT: 8090
  PAYMENT_API_BASE_URL: http://localhost:8080
  WORKER_CPU_LOAD_MS: 500



ingress:
  enabled: true
  className: nginx
  host: payment.local

serviceAccount:
  create: true
  name: payment-system-sa
    




