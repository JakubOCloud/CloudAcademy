apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spring-boot-api.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "spring-boot-api.labels" . | nindent 4 }}

data:
  config.json: |
    {
      "application": "{{ .Values.config.app }}",
      "version": "{{ .Values.config.version }}",
      "profile": "{{ .Values.profile }}"
    }