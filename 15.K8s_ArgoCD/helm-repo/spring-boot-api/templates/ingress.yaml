{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "spring-boot-api.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "spring-boot-api.labels" . | nindent 4 }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "spring-boot-api.fullname" . }}
                port:
                  number: {{ .Values.ports.api }}

          - path: /logs
            pathType: Prefix
            backend:
              service:
                name: {{ include "spring-boot-api.fullname" . }}
                port:
                  number: {{ .Values.ports.logs }}

          - path: /soap
            pathType: Prefix
            backend:
              service:
                name: {{ include "spring-boot-api.fullname" . }}
                port:
                  number: {{ .Values.ports.soap }}
{{- end }}